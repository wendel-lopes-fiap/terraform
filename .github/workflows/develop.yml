name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::{{ sua conta aws }}:role/{{ nome da role }}"
      aws-region: "us-east-2"
      aws-statefile-s3-bucket: "site-wendel"
      aws-lock-dynamodb-table: "wendel-tabela"